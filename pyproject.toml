[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "algo-deca"
version = "0.1.0"
description = "Auditable student class assignment optimizer using PuLP + HiGHS with convex preference weights."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pulp>=4.0.0",
    "highspy>=1.8.0",
    "pydantic>=2.9.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "openpyxl>=3.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.7.0",
]

[project.scripts]
deca = "algo_deca.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/algo_deca"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
